name: macOS Desktop Build

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Git ref to build (default: selected branch)"
        required: false
        type: string

permissions:
  contents: read

jobs:
  build-macos:
    runs-on: macos-15

    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          architecture: arm64
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-desktop.txt

      - name: Create build environment
        run: python -m venv .venv

      - name: Install dependencies
        run: |
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/python -m pip install -r requirements.txt -r requirements-desktop.txt

      - name: Run regression tests
        run: .venv/bin/python -m unittest discover -s tests -q

      - name: Build Apple Silicon app
        run: ./build-macos.sh --skip-install

      - name: Package and validate artifact
        id: package
        shell: bash
        run: |
          set -euo pipefail
          version="$(.venv/bin/python tools/desktop_version.py)"
          export EXPECTED_VERSION="$version"
          archive="dist/PaperVault-v${version}-macos-arm64.zip"
          ditto -c -k --sequesterRsrc --keepParent dist/PaperVault.app "$archive"
          shasum -a 256 "$archive" > "${archive}.sha256"
          archs="$(file dist/PaperVault.app/Contents/MacOS/PaperVault)"
          grep -q 'arm64' <<< "$archs"
          .venv/bin/python - <<'PY'
          from pathlib import Path
          import os
          import plistlib
          import subprocess

          app = Path("dist/PaperVault.app")
          plist = plistlib.loads((app / "Contents/Info.plist").read_bytes())
          version = os.environ["EXPECTED_VERSION"]
          assert plist["CFBundleShortVersionString"] == version.rsplit("-", 1)[0]
          assert plist["CFBundleVersion"] == "1.2.0fc1"
          assert plist["LSMinimumSystemVersion"] == "14.0"
          subprocess.run(["codesign", "--verify", "--deep", "--strict", str(app)], check=True)
          PY
          {
            echo "# macOS arm64 build validation"
            echo
            echo "- Version: ${version}"
            echo "- Runner: macos-15 (Apple Silicon arm64)"
            echo "- Minimum system declared in Info.plist: macOS 14.0"
            echo "- Architecture: ${archs}"
            echo "- Bundle: ${archive}"
            echo "- SHA-256: $(cut -d ' ' -f 1 "${archive}.sha256")"
            echo "- Code signature: codesign --verify --deep --strict passed"
            echo "- Regression tests: passed in the build job"
          } > dist/PaperVault-v${version}-macos-arm64-validation.md
          echo "version=${version}" >> "$GITHUB_OUTPUT"
      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-arm64
          if-no-files-found: error
          path: |
            dist/PaperVault-v*-macos-arm64.zip
            dist/PaperVault-v*-macos-arm64.zip.sha256
            dist/PaperVault-v*-macos-arm64-validation.md
