name: macOS Desktop Build

on:
  workflow_call:
    inputs:
      ref:
        description: "Git ref to build (default: caller ref)"
        required: false
        type: string
  workflow_dispatch:
    inputs:
      ref:
        description: "Git ref to build (default: selected branch)"
        required: false
        type: string

permissions:
  contents: read

jobs:
  build-macos:
    runs-on: macos-15

    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          architecture: arm64
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-desktop.txt

      - name: Create build environment
        run: python -m venv .venv

      - name: Install dependencies
        run: |
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/python -m pip install -r requirements.txt -r requirements-desktop.txt

      - name: Run regression tests
        run: .venv/bin/python -m unittest discover -s tests -q

      - name: Build Apple Silicon app
        run: ./build-macos.sh --skip-install

      - name: Verify frontend and macOS package metadata
        shell: bash
        run: |
          set -euo pipefail
          version="$(.venv/bin/python tools/desktop_version.py)"
          .venv/bin/python tools/verify_desktop_bundle.py \
            --platform macos-arm64 \
            --bundle dist/PaperVault.app \
            --output "dist/PaperVault-v${version}-macos-arm64-validation.json"

      - name: Create release archive and checksum
        shell: bash
        run: |
          set -euo pipefail
          version="$(.venv/bin/python tools/desktop_version.py)"
          archive="dist/PaperVault-v${version}-macos-arm64.zip"
          ditto -c -k --sequesterRsrc --keepParent dist/PaperVault.app "$archive"
          (cd dist && shasum -a 256 "$(basename "$archive")") > "${archive}.sha256"

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-arm64
          if-no-files-found: error
          path: |
            dist/PaperVault-v*-macos-arm64.zip
            dist/PaperVault-v*-macos-arm64.zip.sha256
            dist/PaperVault-v*-macos-arm64-validation.json
