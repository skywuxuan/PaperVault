name: Desktop Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-desktop.txt

      - name: Install desktop dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-desktop.txt

      - name: Build Windows desktop bundle
        shell: pwsh
        run: .\build-windows.ps1 -SkipInstall

      - name: Create release archive
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".TrimStart("v")
          $archive = "dist\PaperVault-v$version-windows-x64.zip"
          Compress-Archive -Path "dist\PaperVault" -DestinationPath $archive

      - name: Upload Windows archive
        uses: actions/upload-artifact@v4
        with:
          name: windows-x64
          path: dist/PaperVault-*-windows-x64.zip

  publish-release:
    runs-on: ubuntu-latest
    needs: [build-windows]

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Download release archives
        uses: actions/download-artifact@v4
        with:
          pattern: "windows-x64"
          path: dist
          merge-multiple: true

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: PaperVault ${{ github.ref_name }}
          body_path: CHANGELOG.md
          files: dist/PaperVault-*.zip
          generate_release_notes: true
