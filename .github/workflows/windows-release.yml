name: Desktop Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  validate-version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Test package version metadata
        run: python -m unittest discover -s tests -p test_desktop_version.py

      - name: Verify release tag matches package version
        id: version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: python tools/desktop_version.py --check-tag "$RELEASE_TAG" --github-output "$GITHUB_OUTPUT"

      - name: Verify version-specific release notes
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: python tools/release_notes.py --version "$RELEASE_TAG" --output release-notes.md

  build-windows:
    runs-on: windows-latest
    needs: [validate-version]

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-desktop.txt

      - name: Install desktop dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-desktop.txt

      - name: Build Windows desktop bundle
        shell: pwsh
        run: .\build-windows.ps1 -SkipInstall

      - name: Create release archive
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ needs.validate-version.outputs.version }}
        run: |
          $archive = "dist\PaperVault-v$env:RELEASE_VERSION-windows-x64.zip"
          Compress-Archive -Path "dist\PaperVault" -DestinationPath $archive

      - name: Upload Windows archive
        uses: actions/upload-artifact@v4
        with:
          name: windows-x64
          if-no-files-found: error
          path: dist/PaperVault-*-windows-x64.zip

  build-macos:
    needs: [validate-version]
    uses: ./.github/workflows/macos-build.yml
    with:
      ref: ${{ github.sha }}

  publish-release:
    runs-on: ubuntu-latest
    needs: [validate-version, build-windows, build-macos]

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Prepare version-specific release notes
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: python tools/release_notes.py --version "$RELEASE_TAG" --output release-notes.md

      - name: Download release archives
        uses: actions/download-artifact@v4
        with:
          pattern: "{windows-x64,macos-arm64}"
          path: dist
          merge-multiple: true

      - name: Verify release archives and prepare checksums
        env:
          RELEASE_VERSION: ${{ needs.validate-version.outputs.version }}
        run: |
          set -euo pipefail
          cd dist
          : > SHA256SUMS.txt
          for platform in windows-x64 macos-arm64; do
            archive="PaperVault-v${RELEASE_VERSION}-${platform}.zip"
            test -s "$archive"
            sha256sum "$archive" > "${archive}.sha256"
            cat "${archive}.sha256" >> SHA256SUMS.txt
          done
          sha256sum --check SHA256SUMS.txt

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: PaperVault ${{ github.ref_name }}
          body_path: release-notes.md
          files: |
            dist/PaperVault-*.zip
            dist/PaperVault-*.zip.sha256
            dist/SHA256SUMS.txt
          fail_on_unmatched_files: true
          generate_release_notes: false
          prerelease: ${{ needs.validate-version.outputs.prerelease == 'true' }}
