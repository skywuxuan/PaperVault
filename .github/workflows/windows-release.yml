name: Windows Desktop Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-desktop.txt

      - name: Install desktop dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-desktop.txt

      - name: Build Windows desktop bundle
        shell: pwsh
        run: .\build-windows.ps1 -SkipInstall

      - name: Create release archive
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".TrimStart("v")
          $archive = "dist\PaperVault-v$version-windows-x64.zip"
          Compress-Archive -Path "dist\PaperVault" -DestinationPath $archive
          "RELEASE_ARCHIVE=$archive" >> $env:GITHUB_ENV

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: PaperVault ${{ github.ref_name }}
          body_path: CHANGELOG.md
          files: ${{ env.RELEASE_ARCHIVE }}
          generate_release_notes: true
